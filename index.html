const link = document.createElement(“link”);
link.rel = “stylesheet”;
link.href = “https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css”;
document.head.appendChild(link);
const script = document.createElement(“script”);
script.src = “https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js”;
script.onload = () => {
if (!mapRef.current) return;
window.mapboxgl.accessToken = MAPBOX_TOKEN;
const map = new window.mapboxgl.Map({
container:mapRef.current,style:“mapbox://styles/mapbox/dark-v11”,
center:[-111.891,40.752],zoom:12.8,attributionControl:false,
});
map.on(“load”,()=>{ mapInstance.current=map; setReady(true); });
};
document.head.appendChild(script);
return ()=>{ if(mapInstance.current){mapInstance.current.remove();mapInstance.current=null;} };
},[]);

useEffect(()=>{
if (!ready||!mapInstance.current) return;
markersRef.current.forEach(m=>m.remove());
markersRef.current=[];
locations.forEach(loc=>{
const coords=VENUE_COORDS[loc.name];
if (!coords) return;
const heat=getHeat(loc.sightings);
const color=getTypeColor(loc.topType);
const size=[0,26,34,42,52,64][heat];
const el=document.createElement(“div”);
el.style.cssText=`width:${size}px;height:${size}px;background:radial-gradient(circle at 35% 35%,${color},${color}88);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 ${heat*5}px ${color}cc;display:flex;align-items:center;justify-content:center;font-size:${Math.floor(size*0.37)}px;cursor:pointer;position:relative;transition:transform 0.2s;`;
el.textContent=“❤️”;
el.onmouseenter=()=>el.style.transform=“scale(1.3)”;
el.onmouseleave=()=>el.style.transform=“scale(1)”;
el.onclick=()=>onSelectSpot(loc);
if (loc.flirtsCount>0) {
const b=document.createElement(“div”);
b.style.cssText=`position:absolute;top:-4px;right:-4px;background:#FF0055;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:8px;color:white;font-weight:700;`;
b.textContent=loc.flirtsCount; el.appendChild(b);
}

lb.textContent=loc.name; el.appendChild(lb);
}
const marker=new window.mapboxgl.Marker({element:el,anchor:“center”}).setLngLat(coords).addTo(mapInstance.current);
markersRef.current.push(marker);
});
